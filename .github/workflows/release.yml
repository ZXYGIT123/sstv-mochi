name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SSTV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SSTV_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少仓库 secret SSTV_KEYSTORE_BASE64，无法签名"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sstv-mochi.jks"
          keytool -list -keystore "$RUNNER_TEMP/sstv-mochi.jks" -storepass "$KEYSTORE_PASSWORD" -alias sstv > /dev/null
          echo "keystore restored: $(stat -c%s "$RUNNER_TEMP/sstv-mochi.jks") bytes"

      - name: Build release APK
        env:
          SSTV_KEYSTORE_PATH: ${{ runner.temp }}/sstv-mochi.jks
          SSTV_KEYSTORE_PASSWORD: ${{ secrets.SSTV_KEYSTORE_PASSWORD }}
          SSTV_KEY_PASSWORD: ${{ secrets.SSTV_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Keep APK as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
